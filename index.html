
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GBHS Kanali Management System</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f1f5f9;color:#172554}
header{background:#12345a;color:white;padding:22px 14px;text-align:center}
header h2{margin:0 0 8px}
main{max-width:700px;margin:auto;padding:16px}
.card{background:white;padding:17px;border-radius:12px;margin:14px 0;box-shadow:0 2px 9px #0001}
h3{color:#166534;margin-top:5px}
input,select,textarea{width:100%;padding:12px;margin:7px 0 13px;border:1px solid #cbd5e1;border-radius:7px;font-size:15px}
button{background:#166534;color:white;border:0;padding:13px 18px;border-radius:8px;font-size:15px;cursor:pointer}
.secondary{background:#12345a}
.student{border-bottom:1px solid #ddd;padding:12px 2px}
.small{font-size:13px;color:#64748b}
footer{text-align:center;padding:20px;color:#64748b}
</style>
</head>
<body>
<header>
<h2>GBHS KANALI</h2>
<div>School Management System</div>
<p><b>WE MAKE WAYS</b></p>
</header>

<main>
<div class="card">
<h3>Students Management</h3>
<p>Student Admission & Records</p>
<button class="secondary" onclick="showForm()">+ Add New Student</button>
</div>

<div class="card" id="formCard">
<h3>New Student Admission</h3>
<form id="studentForm">
<label>Admission Number</label>
<input id="admission" required placeholder="Enter admission number">

<label>Student Name</label>
<input id="name" required placeholder="Student full name">

<label>Father Name</label>
<input id="father" required placeholder="Father name">

<label>Class</label>
<select id="className" required>
<option value="">Select Class</option>
<option>Class 1</option><option>Class 2</option>
<option>Class 3</option><option>Class 4</option>
<option>Class 5</option><option>Class 6</option>
<option>Class 7</option><option>Class 8</option>
<option>Class 9</option><option>Class 10</option>
</select>

<label>Date of Birth</label>
<input type="date" id="dob">

<label>Phone Number</label>
<input id="phone" type="tel" placeholder="Phone number">

<label>Address</label>
<textarea id="address" placeholder="Student address"></textarea>

<button type="submit">Save Student</button>
</form>
</div>

<div class="card">
<h3>Student Records</h3>
<input id="search" placeholder="Search student..." oninput="showStudents()">
<div id="studentList">No student records yet.</div>
</div>
</main>

<footer>Government Boys High School Kanali<br>District Mirpur, AJK</footer>

<script>
function getStudents(){
 return JSON.parse(localStorage.getItem("gbhs_students") || "[]");
}
function showForm(){
 document.getElementById("formCard").scrollIntoView({behavior:"smooth"});
}
document.getElementById("studentForm").addEventListener("submit",function(e){
 e.preventDefault();
 const students=getStudents();
 const admission=document.getElementById("admission").value.trim();
 if(students.some(s=>s.admission===admission)){
  alert("This admission number already exists.");
  return;
 }
 students.push({
  admission:admission,
  name:document.getElementById("name").value.trim(),
  father:document.getElementById("father").value.trim(),
  className:document.getElementById("className").value,
  dob:document.getElementById("dob").value,
  phone:document.getElementById("phone").value.trim(),
  address:document.getElementById("address").value.trim()
 });
 localStorage.setItem("gbhs_students",JSON.stringify(students));
 this.reset();
 showStudents();
 alert("Student saved on this device.");
});
function showStudents(){
 const q=document.getElementById("search").value.toLowerCase();
 const list=document.getElementById("studentList");
 const students=getStudents().filter(s=>
  (s.name+" "+s.father+" "+s.admission+" "+s.className).toLowerCase().includes(q)
 );
 if(!students.length){list.textContent="No student records found.";return;}
 list.innerHTML=students.map(s=>
  `<div class="student"><b>${escapeHTML(s.name)}</b><br>
  Admission: ${escapeHTML(s.admission)}<br>
  Father: ${escapeHTML(s.father)}<br>
  Class: ${escapeHTML(s.className)}<br>
  <span class="small">Phone: ${escapeHTML(s.phone)}</span></div>`
 ).join("");
}
function escapeHTML(value){
 return String(value).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
showStudents();
</script>

</html>
