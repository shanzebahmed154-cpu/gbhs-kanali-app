<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GBHS Kanali Management System</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#f1f5f9;margin:0;padding:15px}
header{background:#123b68;color:white;padding:18px;text-align:center;border-radius:10px}
.container{max-width:650px;margin:20px auto}
.card{background:white;padding:18px;margin-bottom:15px;border-radius:10px;box-shadow:0 2px 8px #0001}
input,select,button{width:100%;padding:12px;margin:7px 0;box-sizing:border-box;border:1px solid #ccc;border-radius:6px;font-size:16px}
button{background:#145da0;color:white;border:0;cursor:pointer}
button:hover{background:#0c4275}
.hidden{display:none}
.student{padding:10px;border-bottom:1px solid #ddd}
#message{padding:10px;color:#b42318}
</style>
</head>
<body>

<header>
<h2>GBHS Kanali</h2>
<p>School Management System</p>
</header>

<div class="container">

<div class="card" id="loginBox">
<h3>Admin Login</h3>
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<div id="app" class="hidden">

<div class="card">
<h3>Dashboard</h3>
<p>Welcome to GBHS Kanali Management System</p>
<button onclick="logout()">Logout</button>
</div>

<div class="card">
<h3>New Student Admission</h3>

<input id="admissionNo" placeholder="Admission Number">
<input id="studentName" placeholder="Student Name">
<input id="fatherName" placeholder="Father Name">
<label>Date of Birth</label>
<input type="date" id="dob">

<select id="classSelect">
<option value="">Loading Classes...</option>
</select>

<label>Admission Date</label>
<input type="date" id="admissionDate">

<input id="phone" placeholder="Phone Number">
<input id="address" placeholder="Address">

<select id="status">
<option value="Active">Active</option>
<option value="Inactive">Inactive</option>
</select>

<button onclick="saveStudent()">Save Student</button>
<div id="message"></div>
</div>

<div class="card">
<h3>Student Records</h3>
<button onclick="loadStudents()">Refresh Records</button>
<div id="studentsList">Loading...</div>
</div>

</div>
</div>

<script>
const SUPABASE_URL = "YOUR_EXISTING_SUPABASE_PROJECT_URL";
const SUPABASE_KEY = "YOUR_EXISTING_PUBLISHABLE_KEY";

const supabaseClient = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let classesData = [];

async function login(){
const email = document.getElementById("email").value.trim();
const password = document.getElementById("password").value;

const {error} = await supabaseClient.auth.signInWithPassword({
email,password
});

if(error){
alert("Login failed: " + error.message);
return;
}

await showApp();
}

async function showApp(){
document.getElementById("loginBox").classList.add("hidden");
document.getElementById("app").classList.remove("hidden");

await loadClasses();
await loadStudents();
}

async function loadClasses(){
const {data,error} = await supabaseClient
.from("classes")
.select("id,class_name")
.order("id");

if(error){
document.getElementById("message").textContent =
"Classes error: " + error.message;
return;
}

classesData = data || [];

const select = document.getElementById("classSelect");
select.innerHTML = '<option value="">Select Class</option>';

classesData.forEach(c=>{
const option = document.createElement("option");
option.value = c.id;
option.textContent = c.class_name;
select.appendChild(option);
});
}

async function saveStudent(){
const message = document.getElementById("message");
message.textContent = "Saving...";

const classId = document.getElementById("classSelect").value;
const selectedClass = classesData.find(c=>String(c.id)===String(classId));

if(!classId || !selectedClass){
message.textContent = "Please select a class.";
return;
}

const record = {
admission_no: document.getElementById("admissionNo").value.trim(),
student_name: document.getElementById("studentName").value.trim(),
father_name: document.getElementById("fatherName").value.trim(),
date_of_birth: document.getElementById("dob").value || null,
"class": selectedClass.class_name,
admission_date: document.getElementById("admissionDate").value || null,
phone: document.getElementById("phone").value.trim(),
address: document.getElementById("address").value.trim(),
status: document.getElementById("status").value,
class_id: classId
};

if(!record.admission_no || !record.student_name || !record.father_name){
message.textContent = "Please enter Admission Number, Student Name and Father Name.";
return;
}

const {error} = await supabaseClient
.from("students")
.insert([record]);

if(error){
message.textContent = "Save failed: " + error.message;
return;
}

message.textContent = "Student saved successfully!";

["admissionNo","studentName","fatherName","dob",
"admissionDate","phone","address"].forEach(id=>{
document.getElementById(id).value="";
});

document.getElementById("classSelect").value="";
await loadStudents();
}

async function loadStudents(){
const list = document.getElementById("studentsList");
list.textContent = "Loading...";

const {data,error} = await supabaseClient
.from("students")
.select("admission_no,student_name,father_name,status")
.order("created_at",{ascending:false});

if(error){
list.textContent = "Error: " + error.message;
return;
}

if(!data || data.length===0){
list.textContent = "No student records found.";
return;
}

list.innerHTML = "";

data.forEach(s=>{
const div = document.createElement("div");
div.className = "student";

const heading = document.createElement("strong");
heading.textContent = s.student_name || "";

const details = document.createElement("p");
details.textContent =
"Admission No: " + (s.admission_no || "") +
" | Father: " + (s.father_name || "") +
" | Status: " + (s.status || "");

div.appendChild(heading);
div.appendChild(details);
list.appendChild(div);
});
}

async function logout(){
await supabaseClient.auth.signOut();
document.getElementById("app").classList.add("hidden");
document.getElementById("loginBox").classList.remove("hidden");
}

async function checkSession(){
const {data} = await supabaseClient.auth.getSession();
if(data.session){
await showApp();
}
}

checkSession();
</script>
</body>
</html>
