
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GBHS Kanali Management System</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #172554;
}
header {
  background: #12345a;
  color: white;
  padding: 28px 15px;
  text-align: center;
}
header h1 { font-size: 25px; margin: 0 0 10px; }
header p { margin: 6px; }
main { padding: 20px 15px; max-width: 650px; margin: auto; }
.welcome { color: #166534; margin-bottom: 18px; }
.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}
.item {
  background: white;
  border-radius: 14px;
  padding: 24px 8px;
  text-align: center;
  font-size: 16px;
  font-weight: bold;
  box-shadow: 0 3px 12px #00000012;
  border-bottom: 4px solid #198754;
}
.emoji { font-size: 30px; display: block; margin-bottom: 10px; }
footer {
  text-align: center;
  padding: 25px 10px;
  color: #64748b;
  font-size: 13px;
}
</style>
</head>
<body>
<header>
  <h1>GBHS KANALI</h1>
  <p>School Management System</p>
  <p><b>WE MAKE WAYS</b></p>
  <p>Session 2026-27</p>
</header>
<main>
  <h3 class="welcome">Welcome to School Dashboard</h3>
  <div class="grid">
    <div class="item"><span class="emoji">👨‍🎓</span>Students</div>
    <div class="item"><span class="emoji">👨‍🏫</span>Teachers</div>
    <div class="item"><span class="emoji">📅</span>Attendance</div>
    <div class="item"><span class="emoji">📚</span>Exams & Results</div>
    <div class="item"><span class="emoji">💳</span>Student Fees</div>
    <div class="item"><span class="emoji">💰</span>School Finance</div>
    <div class="item"><span class="emoji">📊</span>Reports</div>
    <div class="item"><span class="emoji">⚙️</span>Settings</div>
  </div>
</main>
<footer>
Government Boys High School Kanali<br>
District Mirpur, AJK
</footer>
</body>
</html>
